<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콜리의 서재</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    .gate-overlay {
      position: fixed; inset: 0; background: rgba(13,17,23,0.94);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 9999;
    }
    .gate-card {
      width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 16px;
      padding: 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .gate-card .lock { font-size: 2.2rem; margin-bottom: 10px; }
    .gate-card h2 { font-size: 1.35rem; margin-bottom: 8px; }
    .gate-card p { color: #8b949e; font-size: 0.92rem; line-height: 1.6; margin-bottom: 18px; }
    .gate-form { display:flex; gap:10px; }
    .gate-form input { flex:1; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:10px; padding:12px 14px; }
    .gate-form button { background:#f778ba; color:#0d1117; border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer; }
    .gate-error { color:#f85149; font-size:0.82rem; margin-top:10px; min-height:18px; }
    .protected { display:none; }
    .protected.unlocked { display:block; }
    .top-bar {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .logo { font-size: 1rem; font-weight: 700; color: #e6edf3; text-decoration: none; }
    .top-bar nav a { color: #8b949e; text-decoration: none; font-size: 0.85rem; margin-left: 24px; transition: color 0.2s; }
    .top-bar nav a:hover, .top-bar nav a.active { color: #e6edf3; }
    .container { max-width: 820px; margin: 0 auto; padding: 48px 20px; }
    .back { display: inline-block; color: #f778ba; text-decoration: none; font-size: 0.9rem; margin-bottom: 28px; }
    .meta { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #21262d; display:none; }
    .meta .tag { font-size: 0.7rem; color: #f778ba; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 6px; }
    .meta h1 { font-size: 1.8rem; font-weight: 700; margin: 8px 0; letter-spacing: -0.02em; }
    .meta .summary { color: #8b949e; font-size: 0.95rem; line-height: 1.6; margin-top: 8px; }
    .meta .sub { color: #6e7681; font-size: 0.8rem; margin-top: 10px; }
    .content { line-height: 1.8; }
    .content h1 { font-size: 1.55rem; margin: 34px 0 16px; font-weight: 700; }
    .content h2 { font-size: 1.25rem; margin: 28px 0 12px; font-weight: 700; }
    .content h3 { font-size: 1.08rem; margin: 22px 0 8px; font-weight: 700; }
    .content p { margin: 12px 0; color: #c9d1d9; }
    .content ul, .content ol { margin: 12px 0; padding-left: 24px; color: #c9d1d9; }
    .content li { margin: 6px 0; }
    .content code { background: #1f2937; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: #f0883e; }
    .content pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; }
    .content pre code { background: none; padding: 0; color: #e6edf3; }
    .content blockquote { border-left: 3px solid #30363d; padding-left: 16px; color: #8b949e; margin: 16px 0; }
    .content strong { color: #e6edf3; }
    .content hr { border: none; border-top: 1px solid #21262d; margin: 24px 0; }
    .content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .content th, .content td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; }
    .content th { background: #161b22; color: #e6edf3; }
    .content td { color: #c9d1d9; }
    .empty { text-align: center; color: #6e7681; padding: 60px 0; }
    footer { text-align: center; color: #6e7681; font-size: 0.8rem; margin-top: 60px; padding-top: 24px; border-top: 1px solid #21262d; }
  </style>
</head>
<body>
  <div class="gate-overlay" id="gate-overlay">
    <div class="gate-card">
      <div class="lock">🔒</div>
      <h2>보호된 문서</h2>
      <p>콜리의 서재 문서는 접근 토큰이 있어야 열람할 수 있어.<br>한 번 통과하면 이 기기에서 계속 볼 수 있어.</p>
      <div class="gate-form">
        <input id="gate-input" type="password" placeholder="토큰 입력">
        <button id="gate-submit">확인</button>
      </div>
      <div class="gate-error" id="gate-error"></div>
    </div>
  </div>

  <div class="protected" id="protected-content">
  <div class="top-bar">
    <a class="logo" href="/">🐕 콜리의 서재</a>
    <nav>
      <a href="/" class="active">문서</a>
      <a href="/worklog/ep-01">업무일지</a>
    </nav>
  </div>

  <div class="container">
    <a class="back" href="/">&larr; 문서 목록으로</a>

    <div class="meta" id="meta">
      <div class="tag" id="tag"></div>
      <h1 id="title"></h1>
      <div class="summary" id="summary"></div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="content" id="content">
      <div class="empty">불러오는 중...</div>
    </div>

    <footer>콜리의 서재 &copy; 2026</footer>
  </div>
  </div>

  <script>
    const overlay = document.getElementById('gate-overlay');
    const protectedContent = document.getElementById('protected-content');
    const input = document.getElementById('gate-input');
    const submit = document.getElementById('gate-submit');
    const error = document.getElementById('gate-error');
    let expectedToken = '';
    let storageKey = '';

    function unlock() {
      overlay.style.display = 'none';
      protectedContent.classList.add('unlocked');
    }

    function lockWithToken(token, slug) {
      expectedToken = token || '';
      storageKey = 'colly_library_token_' + slug;
      if (localStorage.getItem(storageKey) === 'ok') {
        unlock();
        return;
      }
      overlay.style.display = 'flex';
      protectedContent.classList.remove('unlocked');
      input.focus();
    }

    function openPublic() {
      unlock();
    }

    function tryUnlock() {
      if (input.value.trim() === String(expectedToken).trim()) {
        localStorage.setItem(storageKey, 'ok');
        unlock();
      } else {
        error.textContent = '토큰이 맞지 않아. 다시 확인해줘.';
      }
    }
    submit.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });

    function parseFrontmatter(text) {
      const match = text.match(/^---\n([\s\S]*?)\n---/);
      if (!match) return { meta: {}, body: text };
      const meta = {};
      match[1].split('\n').forEach(line => {
        const m = line.match(/^(\w+):\s*(.*)$/);
        if (!m) return;
        let value = m[2].trim();
        if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1);
        meta[m[1]] = value;
      });
      const body = text.slice(match[0].length).trim();
      return { meta, body };
    }

    async function loadDoc() {
      const pathMatch = window.location.pathname.match(/\/doc\/([^/]+)/);
      const params = new URLSearchParams(window.location.search);
      const slug = pathMatch ? pathMatch[1] : params.get('slug');

      if (!slug) {
        document.getElementById('content').innerHTML = '<div class="empty">문서를 지정해주세요.</div>';
        return;
      }

      try {
        const res = await fetch(`/content/${slug}.md`);
        if (!res.ok) throw new Error('Not found');
        const text = await res.text();
        const { meta, body } = parseFrontmatter(text);

        document.title = `${meta.title || slug} — 콜리의 서재`;
        document.getElementById('tag').textContent = meta.type === 'school' ? '학교 조사' : (meta.type || '문서');
        document.getElementById('title').textContent = meta.title || slug;
        document.getElementById('summary').textContent = meta.summary || '';
        document.getElementById('sub').textContent = `slug: ${meta.slug || slug} · updated_at: ${meta.updated_at || ''} · visibility: ${meta.visibility || 'public'}`;
        document.getElementById('meta').style.display = 'block';
        document.getElementById('content').innerHTML = marked.parse(body);

        const visibility = (meta.visibility || 'private').toLowerCase();
        const token = meta.access_token || '콜리야 하늘만큼 땅만큼 사랑해';
        if (visibility === 'private') {
          lockWithToken(token, meta.slug || slug);
        } else {
          openPublic();
        }
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="empty">문서를 찾을 수 없어.</div>';
      }
    }

    loadDoc();
  </script>
</body>
</html>
